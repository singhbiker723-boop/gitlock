<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Enrollment</title>
  <style>
    :root { --ink: #1c2b36; --brand: #1f6f8b; --line: #c9d6de; --bg: #f3f7f9; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 1.25rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); background: var(--bg); line-height: 1.5;
    }
    .card {
      width: 100%; max-width: 480px; background: #fff; padding: 2rem;
      border-radius: 10px; border: 1px solid var(--line);
    }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    .sub { margin: 0 0 1.5rem; color: #52646f; }
    label { display: block; font-weight: 600; margin-bottom: 1rem; }
    input, select {
      display: block; width: 100%; margin-top: .35rem; padding: .7rem .8rem;
      font: inherit; font-weight: 400; color: var(--ink);
      border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
    button {
      width: 100%; padding: .85rem; font: inherit; font-weight: 700; color: #fff;
      background: var(--brand); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #185a72; }
    #result { margin-top: 1.25rem; padding: 1rem; border-radius: 6px; background: #e6f4ea; display: none; }
    #result h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
    #result p { margin: .15rem 0; }
    @media (max-width: 420px) { .row { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Course Enrollment</h1>
    <p class="sub">Fill in your details to enroll in a course.</p>

    <form id="enrollForm">
      <label for="name">Full name
        <input type="text" id="name" name="name" autocomplete="name" required>
      </label>

      <label for="course">Course name
        <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required>
      </label>

      <div class="row">
        <label for="year">Year
          <select id="year" name="year" required>
            <option value="" disabled selected>Select</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
          </select>
        </label>

        <label for="semester">Semester
          <select id="semester" name="semester" required>
            <option value="" disabled selected>Select</option>
            <option>Semester 1</option>
            <option>Semester 2</option>
            <option>Semester 3</option>
            <option>Semester 4</option>
            <option>Semester 5</option>
            <option>Semester 6</option>
            <option>Semester 7</option>
            <option>Semester 8</option>
          </select>
        </label>
      </div>

      <label for="email">Email
        <input type="email" id="email" name="email" autocomplete="email" required>
      </label>

      <button type="submit">Enroll now</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById("enrollForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const d = new FormData(form);

      // Build the confirmation with textContent so typed text is never run as HTML
      result.textContent = "";
      const title = document.createElement("h2");
      title.textContent = "Enrollment received";
      result.appendChild(title);

      [["Name", "name"], ["Course", "course"], ["Year", "year"],
       ["Semester", "semester"], ["Email", "email"]].forEach(function (f) {
        const p = document.createElement("p");
        p.textContent = f[0] + ": " + d.get(f[1]);
        result.appendChild(p);
      });

      result.style.display = "block";
      form.reset();
    });
  </script>
</body>
</html>
