<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    :root { --ink: #1c2b36; --brand: #1f6f8b; --bg: #f3f7f9; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 1.25rem; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); background: var(--bg); line-height: 1.6;
    }
    main { max-width: 520px; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); margin: 0 0 .5rem; }
    p { margin: 0 0 2rem; color: #52646f; font-size: 1.1rem; }
    .btn {
      display: inline-block; padding: .9rem 2rem; font-weight: 700;
      color: #fff; background: var(--brand); border-radius: 6px;
      text-decoration: none; transition: background .15s;
    }
    .btn:hover { background: #185a72; }
    .btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Our Institute</h1>
    <p>Ready to start learning? Enroll in a course today.</p>
    <a class="btn" href="enrollment.html">Enrollment</a>
  </main>
</body>
</html>
